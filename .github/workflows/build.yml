name: Build Native Applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build fat JAR
        run: |
          cd kitap-tatar
          mvn clean package
      
      - name: Create Windows executable
        run: |
          cd kitap-tatar
          mkdir installer_output
          dir target\*.jar
          jpackage `
            --input target `
            --name "KitapTatar" `
            --main-jar kitap-tatar-app-1.0.0-shaded.jar `
            --main-class com.tatar.learn.KitapApp `
            --type app-image `
            --dest installer_output `
            --win-menu `
            --icon src/main/deploy/kitap.ico `
            --verbose
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-Windows
          path: kitap-tatar/installer_output/KitapTatar/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build fat JAR
        run: |
          cd kitap-tatar
          mvn clean package
      
      - name: Create macOS app
        run: |
          cd kitap-tatar
          mkdir -p installer_output
          ls target/*.jar
          jpackage \
            --input target \
            --name "KitapTatar" \
            --main-jar kitap-tatar-app-1.0.0-shaded.jar \
            --main-class com.tatar.learn.KitapApp \
            --type app-image \
            --dest installer_output \
            --mac-package-name "KitapTatar" \
            --icon src/main/deploy/kitap.icns \
            --verbose
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-macOS
          path: kitap-tatar/installer_output/KitapTatar.app/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev fakeroot
      
      - name: Build fat JAR
        run: |
          cd kitap-tatar
          mvn clean package
      
      - name: Create Linux executable
        run: |
          cd kitap-tatar
          mkdir -p installer_output
          ls target/*.jar
          jpackage \
            --input target \
            --name "kitap-tatar" \
            --main-jar kitap-tatar-app-1.0.0-shaded.jar \
            --main-class com.tatar.learn.KitapApp \
            --type app-image \
            --dest installer_output \
            --icon src/main/deploy/kitap.png \
            --verbose
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-Linux
          path: kitap-tatar/installer_output/kitap-tatar/
