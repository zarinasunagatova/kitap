name: Build Native Applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: |
          cd kitap-tatar
          mvn clean package
      
      - name: Create Windows executable
        shell: pwsh
        run: |
          cd kitap-tatar
          
          # Создаем структуру для jpackage
          mkdir -p target/input
          copy target\*.jar target\input\
          copy target\libs\* target\input\
          
          # Создаем приложение
          jpackage `
            --type app-image `
            --name "KitapTatar" `
            --input target/input `
            --main-jar kitap-tatar-app-1.0.0.jar `
            --main-class com.tatar.learn.KitapApp `
            --dest installer_output `
            --win-console `
            --verbose `
            --icon src/main/deploy/kitap.ico `
            --java-options "--enable-native-access=ALL-UNNAMED" `
            --java-options "-Djava.library.path=."
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-Windows
          path: kitap-tatar/installer_output/KitapTatar/
  
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: |
          cd kitap-tatar
          mvn clean package
      
      - name: Create macOS app
        run: |
          cd kitap-tatar
          
          # Создаем структуру для jpackage
          mkdir -p target/input
          cp target/*.jar target/input/
          cp -r target/libs/* target/input/
          
          # Создаем приложение
          jpackage \
            --type app-image \
            --name "KitapTatar" \
            --input target/input \
            --main-jar kitap-tatar-app-1.0.0.jar \
            --main-class com.tatar.learn.KitapApp \
            --dest installer_output \
            --mac-package-name "KitapTatar" \
            --verbose \
            --icon src/main/deploy/kitap.icns \
            --java-options "--enable-native-access=ALL-UNNAMED"
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-macOS
          path: kitap-tatar/installer_output/KitapTatar.app/
  
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev fakeroot
      
      - name: Build with Maven
        run: |
          cd kitap-tatar
          mvn clean package
      
      - name: Create Linux executable
        run: |
          cd kitap-tatar
          
          # Создаем структуру для jpackage
          mkdir -p target/input
          cp target/*.jar target/input/
          cp -r target/libs/* target/input/
          
          # Создаем приложение
          jpackage \
            --type app-image \
            --name "kitap-tatar" \
            --input target/input \
            --main-jar kitap-tatar-app-1.0.0.jar \
            --main-class com.tatar.learn.KitapApp \
            --dest installer_output \
            --verbose \
            --icon src/main/deploy/kitap.png \
            --java-options "--enable-native-access=ALL-UNNAMED"
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-Linux
          path: kitap-tatar/installer_output/kitap-tatar/
