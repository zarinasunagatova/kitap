name: Build & Release KitapApp

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
      
      - name: Download JavaFX jmods
        run: |
          cd kitap-tatar
          curl -L https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_windows-x64_bin-jmods.zip -o javafx-jmods.zip
          unzip javafx-jmods.zip -d javafx-jmods
          dir javafx-jmods\javafx-jmods-21.0.3
      
      - name: Create custom runtime with jlink
        run: |
          cd kitap-tatar
          jlink --module-path "javafx-jmods\javafx-jmods-21.0.3;$env:JAVA_HOME\jmods" --add-modules java.base,java.desktop,java.logging,java.sql,java.sql.rowset,java.prefs,javafx.controls,javafx.fxml,javafx.media --strip-debug --no-man-pages --no-header-files --compress=2 --output custom-runtime
          Write-Host "=== custom-runtime/bin ==="
          Get-ChildItem custom-runtime\bin
      
      - name: Build and prepare input directory
        run: |
          cd kitap-tatar
          mvn clean package
          mvn dependency:copy-dependencies -DincludeScope=runtime
          New-Item -ItemType Directory -Force target\jpackage-input
          Copy-Item target\kitap-tatar-app-1.0.0.jar target\jpackage-input\
          if (Test-Path target\lib) {
            Copy-Item target\lib\* target\jpackage-input\ -Force
          }
          Write-Host "=== Contents of jpackage-input ==="
          Get-ChildItem target\jpackage-input\
      
      - name: Remove slf4j-simple from dependencies
        run: |
          cd kitap-tatar
          Remove-Item -Force target\lib\slf4j-simple-*.jar -ErrorAction SilentlyContinue
          Remove-Item -Force target\jpackage-input\slf4j-simple-*.jar -ErrorAction SilentlyContinue
          Write-Host "Removed slf4j-simple if present"
      
      - name: Create Windows executable
        run: |
          cd kitap-tatar
          mkdir installer_output
          jpackage --input target\jpackage-input --name "KitapApp" --main-jar kitap-tatar-app-1.0.0.jar --main-class com.tatar.learn.KitapApp --type app-image --dest installer_output --icon src\main\deploy\kitap.ico --runtime-image custom-runtime --win-console
          Write-Host "=== Checking runtime in output ==="
          Get-ChildItem installer_output\KitapApp
          Get-ChildItem installer_output\KitapApp\runtime\bin -ErrorAction SilentlyContinue
      
      - name: Fix KitapApp.cfg
        shell: pwsh
        run: |
          cd kitap-tatar\installer_output\KitapApp\app
          Write-Host "=== FIXING KitapApp.cfg ==="
          $correctCfg = @"
          [Application]
          app.mainclass=com.tatar.learn.KitapApp
          app.classpath=`$APPDIR\gson-2.10.1.jar
          app.classpath=`$APPDIR\kitap-tatar-app-1.0.0.jar
          app.classpath=`$APPDIR\commons-text-1.11.0.jar
          app.classpath=`$APPDIR\javafx-base-21.0.3-win.jar
          app.classpath=`$APPDIR\javafx-base-21.0.3.jar
          app.classpath=`$APPDIR\javafx-controls-21.0.3-win.jar
          app.classpath=`$APPDIR\javafx-controls-21.0.3.jar
          app.classpath=`$APPDIR\javafx-fxml-21.0.3-win.jar
          app.classpath=`$APPDIR\javafx-fxml-21.0.3.jar
          app.classpath=`$APPDIR\javafx-graphics-21.0.3-win.jar
          app.classpath=`$APPDIR\javafx-graphics-21.0.3.jar
          app.classpath=`$APPDIR\javafx-media-21.0.3-win.jar
          app.classpath=`$APPDIR\javafx-media-21.0.3.jar
          app.classpath=`$APPDIR\logback-classic-1.4.14.jar
          app.classpath=`$APPDIR\logback-core-1.4.14.jar
          app.classpath=`$APPDIR\slf4j-api-2.0.12.jar
          app.classpath=`$APPDIR\sqlite-jdbc-3.45.3.0.jar

          [JavaOptions]
          java-options=--module-path=`$APPDIR
          java-options=--add-modules=javafx.controls,javafx.fxml,javafx.media
          java-options=--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED
          java-options=--add-opens=javafx.base/com.sun.javafx.collections=ALL-UNNAMED
          java-options=-Djpackage.app-version=1.0
          "@
          $correctCfg | Out-File -FilePath KitapApp.cfg -Encoding UTF8
          Write-Host "=== FIXED KitapApp.cfg ==="
          Get-Content KitapApp.cfg
      
      - name: Create launcher batch file
        shell: pwsh
        run: |
          cd kitap-tatar\installer_output\KitapApp
          $runBat = @'
          @echo off
          chcp 65001 > nul
          cd /d "%~dp0"
          echo Starting KitapApp...
          "%CD%\runtime\bin\java.exe" --module-path "%CD%\app" --add-modules javafx.controls,javafx.fxml,javafx.media -cp "%CD%\app\gson-2.10.1.jar;%CD%\app\kitap-tatar-app-1.0.0.jar;%CD%\app\*" com.tatar.learn.KitapApp
          if errorlevel 1 (
              echo.
              echo Error starting application. Please check Java installation.
              pause
          )
          '@
          $runBat | Out-File -FilePath "Запустить KitapApp.bat" -Encoding ASCII
          Write-Host "=== Created Запустить KitapApp.bat ==="
      
      - name: Compress Windows artifact
        run: |
          cd kitap-tatar
          Compress-Archive -Path installer_output\KitapApp -DestinationPath KitapApp-Windows.zip
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapApp-Windows
          path: kitap-tatar/KitapApp-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
      
      - name: Download JavaFX jmods
        run: |
          cd kitap-tatar
          curl -L https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_osx-x64_bin-jmods.zip -o javafx-jmods.zip
          unzip javafx-jmods.zip -d javafx-jmods
          ls -la javafx-jmods/javafx-jmods-21.0.3
      
      - name: Create custom runtime with jlink
        run: |
          cd kitap-tatar
          jlink --module-path "javafx-jmods/javafx-jmods-21.0.3:$JAVA_HOME/jmods" --add-modules java.base,java.desktop,java.logging,java.sql,java.sql.rowset,java.prefs,javafx.controls,javafx.fxml,javafx.media --strip-debug --no-man-pages --no-header-files --compress=2 --output custom-runtime
          echo "=== custom-runtime/bin ==="
          ls -la custom-runtime/bin/
      
      - name: Build and prepare input directory
        run: |
          cd kitap-tatar
          mvn clean package
          mvn dependency:copy-dependencies -DincludeScope=runtime
          mkdir -p target/jpackage-input
          cp target/kitap-tatar-app-1.0.0.jar target/jpackage-input/
          if [ -d "target/lib" ]; then
            cp target/lib/* target/jpackage-input/
          fi
          echo "=== Contents of jpackage-input ==="
          ls -la target/jpackage-input/
      
      - name: Remove slf4j-simple from dependencies
        run: |
          cd kitap-tatar
          rm -f target/lib/slf4j-simple-*.jar
          rm -f target/jpackage-input/slf4j-simple-*.jar 2>/dev/null || true
          echo "Removed slf4j-simple if present"
      
      - name: Create macOS app
        run: |
          cd kitap-tatar
          mkdir -p installer_output
          jpackage --input target/jpackage-input --name "KitapApp" --main-jar kitap-tatar-app-1.0.0.jar --main-class com.tatar.learn.KitapApp --type app-image --dest installer_output --mac-package-name "KitapApp" --icon src/main/deploy/kitap.icns --runtime-image custom-runtime
          echo "=== Checking runtime in output ==="
          ls -la installer_output/KitapApp.app/Contents/
          ls -la installer_output/KitapApp.app/Contents/runtime/bin/ || echo "WARNING: runtime/bin not found"
          
      - name: Fix KitapApp.cfg for macOS
        run: |
          cd kitap-tatar/installer_output/KitapApp.app/Contents/app
          echo "=== FIXING KitapApp.cfg for macOS ==="
          cat > KitapApp.cfg << 'EOF'
          [Application]
          app.mainclass=com.tatar.learn.KitapApp
          app.classpath=$APPDIR/gson-2.10.1.jar
          app.classpath=$APPDIR/kitap-tatar-app-1.0.0.jar
          app.classpath=$APPDIR/commons-text-1.11.0.jar
          app.classpath=$APPDIR/javafx-base-21.0.3-mac.jar
          app.classpath=$APPDIR/javafx-base-21.0.3.jar
          app.classpath=$APPDIR/javafx-controls-21.0.3-mac.jar
          app.classpath=$APPDIR/javafx-controls-21.0.3.jar
          app.classpath=$APPDIR/javafx-fxml-21.0.3-mac.jar
          app.classpath=$APPDIR/javafx-fxml-21.0.3.jar
          app.classpath=$APPDIR/javafx-graphics-21.0.3-mac.jar
          app.classpath=$APPDIR/javafx-graphics-21.0.3.jar
          app.classpath=$APPDIR/javafx-media-21.0.3-mac.jar
          app.classpath=$APPDIR/javafx-media-21.0.3.jar
          app.classpath=$APPDIR/logback-classic-1.4.14.jar
          app.classpath=$APPDIR/logback-core-1.4.14.jar
          app.classpath=$APPDIR/slf4j-api-2.0.12.jar
          app.classpath=$APPDIR/sqlite-jdbc-3.45.3.0.jar

          [JavaOptions]
          java-options=--module-path=$APPDIR
          java-options=--add-modules=javafx.controls,javafx.fxml,javafx.media
          java-options=--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED
          java-options=--add-opens=javafx.base/com.sun.javafx.collections=ALL-UNNAMED
          java-options=-Djpackage.app-version=1.0
          EOF
          echo "=== FIXED KitapApp.cfg ==="
          cat KitapApp.cfg
      
      - name: Compress macOS artifact
        run: |
          cd kitap-tatar
          zip -r KitapApp-macOS.zip installer_output/KitapApp.app
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapApp-macOS
          path: kitap-tatar/KitapApp-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'liberica'
      
      - name: Download JavaFX jmods
        run: |
          cd kitap-tatar
          curl -L https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_linux-x64_bin-jmods.zip -o javafx-jmods.zip
          unzip javafx-jmods.zip -d javafx-jmods
          ls -la javafx-jmods/javafx-jmods-21.0.3
      
      - name: Create custom runtime with jlink
        run: |
          cd kitap-tatar
          jlink --module-path "javafx-jmods/javafx-jmods-21.0.3:$JAVA_HOME/jmods" --add-modules java.base,java.desktop,java.logging,java.sql,java.sql.rowset,java.prefs,javafx.controls,javafx.fxml,javafx.media --strip-debug --no-man-pages --no-header-files --compress=2 --output custom-runtime
          echo "=== custom-runtime/bin ==="
          ls -la custom-runtime/bin/
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev fakeroot
      
      - name: Build and prepare input directory
        run: |
          cd kitap-tatar
          mvn clean package
          mvn dependency:copy-dependencies -DincludeScope=runtime
          mkdir -p target/jpackage-input
          cp target/kitap-tatar-app-1.0.0.jar target/jpackage-input/
          if [ -d "target/lib" ]; then
            cp target/lib/* target/jpackage-input/
          fi
          echo "=== Contents of jpackage-input ==="
          ls -la target/jpackage-input/
      
      - name: Remove slf4j-simple from dependencies
        run: |
          cd kitap-tatar
          rm -f target/lib/slf4j-simple-*.jar
          rm -f target/jpackage-input/slf4j-simple-*.jar 2>/dev/null || true
          echo "Removed slf4j-simple if present"
      
      - name: Create Linux executable
        run: |
          cd kitap-tatar
          mkdir -p installer_output
          jpackage --input target/jpackage-input --name "kitap-app" --main-jar kitap-tatar-app-1.0.0.jar --main-class com.tatar.learn.KitapApp --type app-image --dest installer_output --icon src/main/deploy/kitap.png --runtime-image custom-runtime
          echo "=== Checking runtime in output ==="
          ls -la installer_output/kitap-app/
          ls -la installer_output/kitap-app/runtime/bin/ || echo "WARNING: runtime/bin not found"
          
      - name: Fix KitapApp.cfg for Linux
        run: |
          cd kitap-tatar/installer_output/kitap-app/lib/app
          echo "=== FIXING KitapApp.cfg for Linux ==="
          cat > KitapApp.cfg << 'EOF'
          [Application]
          app.mainclass=com.tatar.learn.KitapApp
          app.classpath=$APPDIR/gson-2.10.1.jar
          app.classpath=$APPDIR/kitap-tatar-app-1.0.0.jar
          app.classpath=$APPDIR/commons-text-1.11.0.jar
          app.classpath=$APPDIR/javafx-base-21.0.3-linux.jar
          app.classpath=$APPDIR/javafx-base-21.0.3.jar
          app.classpath=$APPDIR/javafx-controls-21.0.3-linux.jar
          app.classpath=$APPDIR/javafx-controls-21.0.3.jar
          app.classpath=$APPDIR/javafx-fxml-21.0.3-linux.jar
          app.classpath=$APPDIR/javafx-fxml-21.0.3.jar
          app.classpath=$APPDIR/javafx-graphics-21.0.3-linux.jar
          app.classpath=$APPDIR/javafx-graphics-21.0.3.jar
          app.classpath=$APPDIR/javafx-media-21.0.3-linux.jar
          app.classpath=$APPDIR/javafx-media-21.0.3.jar
          app.classpath=$APPDIR/logback-classic-1.4.14.jar
          app.classpath=$APPDIR/logback-core-1.4.14.jar
          app.classpath=$APPDIR/slf4j-api-2.0.12.jar
          app.classpath=$APPDIR/sqlite-jdbc-3.45.3.0.jar

          [JavaOptions]
          java-options=--module-path=$APPDIR
          java-options=--add-modules=javafx.controls,javafx.fxml,javafx.media
          java-options=--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED
          java-options=--add-opens=javafx.base/com.sun.javafx.collections=ALL-UNNAMED
          java-options=-Djpackage.app-version=1.0
          EOF
          echo "=== FIXED KitapApp.cfg ==="
          cat KitapApp.cfg
      
      - name: Compress Linux artifact
        run: |
          cd kitap-tatar
          tar -czf KitapApp-Linux.tar.gz -C installer_output kitap-app
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapApp-Linux
          path: kitap-tatar/KitapApp-Linux.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}