name: Build Native Applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: cd kitap-tatar && mvn clean package -P windows
      
      - name: Create Windows executable
        run: |
          cd kitap-tatar
          mkdir installer_output
          dir target
          jpackage `
            --input target `
            --name "KitapTatar" `
            --main-jar kitap-tatar-app-1.0.0.jar `
            --main-class com.tatar.learn.KitapApp `
            --type app-image `
            --dest installer_output `
            --win-console `
            --verbose
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-Windows
          path: kitap-tatar/installer_output/
  
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: cd kitap-tatar && mvn clean package -P mac
      
      - name: Create macOS app
        run: |
          cd kitap-tatar
          mkdir -p installer_output
          ls -la target
          jpackage \
            --input target \
            --name "KitapTatar" \
            --main-jar kitap-tatar-app-1.0.0.jar \
            --main-class com.tatar.learn.KitapApp \
            --type app-image \
            --dest installer_output \
            --mac-package-name "KitapTatar" \
            --verbose
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-macOS
          path: kitap-tatar/installer_output/
  
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev fakeroot
      
      - name: Build with Maven
        run: cd kitap-tatar && mvn clean package -P linux
      
      - name: Create Linux executable
        run: |
          cd kitap-tatar
          mkdir -p installer_output
          ls -la target
          jpackage \
            --input target \
            --name "kitap-tatar" \
            --main-jar kitap-tatar-app-1.0.0.jar \
            --main-class com.tatar.learn.KitapApp \
            --type app-image \
            --dest installer_output \
            --verbose
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitapTatar-Linux
          path: kitap-tatar/installer_output/
